{% extends "admin/index.html" %}
{% load static currency_tags %}

{% block content %}
{{ block.super }}

<div class="row">
    <div class="col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title">Tổng Đơn Hàng</h5>
                <p class="card-text display-4">{{ total_orders }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title">Tổng Doanh Thu</h5>
                <p class="card-text display-4">{{ total_revenue|vnd }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <h5 class="card-title">Sản Phẩm Đã Bán</h5>
                <p class="card-text display-4">{{ total_products_sold }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <h5 class="card-title">Tổng Người Dùng</h5>
                <p class="card-text display-4">{{ total_users }}</p>
            </div>
        </div>
    </div>
</div>

<div class="mt-4">
    <a href="/products/reports/" class="btn btn-secondary">Xem Báo Cáo Chi Tiết</a>
</div>
{% endblock %}
